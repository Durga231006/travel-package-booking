spring.application.name=travel-package-booking
server.port=8080

# ---- Database (change user/password with environment variables or edit here) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/travel_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Durga}

# Tables, procedure, function and triggers are created by schema.sql (not by Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Run schema.sql and data.sql on every start.
# "$$" is the statement separator because procedures/triggers contain ";" inside BEGIN...END
spring.sql.init.mode=always
spring.sql.init.separator=$$
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
